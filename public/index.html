<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="Frase do dia, citações, aforismos e conteúdos da teosofia.org direto no seu celular.">
  <title>Teosofia — Frase do Dia</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header>
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <img src="/icons/buda-square.png" alt="" width="36" height="36">
      </span>
      <span>TEOSOFIA.org<span class="sub">Pílulas de Teosofia Diárias</span></span>
    </div>
    <div class="actions">
      <button id="pushBtn" class="btn-ghost">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
        </svg>
        <span class="push-label">Ativar notificações</span>
      </button>
    </div>
  </header>

  <main>
    <!-- Seção de assinatura -->
    <section id="subscribeSection" class="card">
      <span class="tag">Assinatura grátis</span>
      <h2>Receba conteúdo do dia</h2>
      <p class="hint">Cadastre-se gratuitamente para receber conteúdo diário e ficar por dentro das novidades. Sem spam.</p>
      <form id="subscribeForm" class="subscribe-form">
        <input id="name" type="text" placeholder="Seu nome (opcional)" autocomplete="name">
        <input id="contact" type="text" placeholder="Email ou telefone" autocomplete="email" required>
        <button id="subscribeBtn" type="submit" class="btn-primary btn-block">Cadastrar</button>
      </form>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>

    <!-- Conteúdo dinâmico -->
    <div id="content">
      <div class="loading"><div class="spinner"></div>Carregando…</div>
    </div>
  </main>

  <nav class="bottom">
    <button data-tab="hoje" class="active"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 18a5 5 0 0 0-10 0"/><path d="M12 9V2"/><path d="M4.2 10.2l1.4 1.4"/><path d="M19.8 10.2l-1.4 1.4"/><path d="M21 18H3"/><path d="M8 22h8"/></svg></span>Hoje</button>
    <button data-tab="assinar"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></span>Assinar</button>
    <button data-tab="conteudo"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>Conteúdo</button>
  </nav>

  <script src="/js/app.js"></script>
</body>
</html>
